version: "2"
sql:
  - engine: postgresql
    queries: db/queries
    schema:
      - internal/migrate/migrations/000001_init.up.sql
      - internal/migrate/migrations/000002_periods.up.sql
      - internal/migrate/migrations/000003_daily_menu.up.sql
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: jsonb
            go_type: encoding/json.RawMessage
