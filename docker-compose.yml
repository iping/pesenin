services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pesenin
      POSTGRES_PASSWORD: pesenin
      POSTGRES_DB: pesenin
    ports:
      - "54329:5432"
    volumes:
      - pesenin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pesenin"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://pesenin:pesenin@db:5432/pesenin?sslmode=disable
      HTTP_ADDR: ":8080"
      PUBLIC_ORIGIN: http://localhost:43123
      COOKIE_SECURE: "false"
      DEV_LOGIN: "true"
      SEED_DEMO: "true"
      ADMIN_EMAIL: admin@pesenin.test
      STORAGE_DIR: /data/uploads
      STORAGE_DRIVER: local
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:43123/api/v1/auth/google/callback}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@pesenin.product.biz.id}
      MAIL_DRIVER: ${MAIL_DRIVER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-Pesenin <noreply@pesenin.product.biz.id>}"
      WA_PROVIDER: ${WA_PROVIDER:-log}
      WA_API_URL: ${WA_API_URL:-}
      WA_API_TOKEN: ${WA_API_TOKEN:-}
      WA_SENDER_ID: ${WA_SENDER_ID:-}
      KYC_GATE: ${KYC_GATE:-contact}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    volumes:
      - pesenin_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8080
      ORIGIN: http://localhost:43123
      PORT: "3000"
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    ports:
      - "43123:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web

volumes:
  pesenin_pg:
  pesenin_uploads:
